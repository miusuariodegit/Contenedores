services:
  db:
    image: mysql:8.0  #Seleccionamos la imagen de mysql 8.0 del repositorio de DcokerHub
    container_name: mysql_db
    environment: #establecemos las variables de ambiente
      MYSQL_ROOT_PASSWORD: mipassword
      MYSQL_DATABASE: crud_python
      MYSQL_USER: usuario             
      MYSQL_PASSWORD: mipassword 
    ports: # Se expone el puerto 3306
      - "3306:3306"
    volumes:
      - ./mysql-init-files:/docker-entrypoint-initdb.d #Ruta para inicializar los archivos .SQL
      - db_persitence_compendio:/var/lib/mysql  # Volumen donde se guardara la informacion de mysql

  python_app_compendio: # Pull de la imagen de DockerHub 
    image: dockerdepruebas/dockercompendio-python_app_compendio
    container_name: python_app_compendio
    ports: # Exponemos el puerto 5600
      - "5600:5600"
    depends_on:
      - db # Se establece que utiliza la el contenedor de MYSQL

  php_app_compendio: # Pull de la imagen de DockerHub 
    image: dockerdepruebas/dockercompendio-php_app_compendio   
    container_name: php_app_compendio
    ports: # se expone el puerto 80
      - "80:80"
    depends_on:
      - db # Se establece que utiliza la el contenedor de MYSQL

  tomcat_app_compendio: # Pull de la imagen de DockerHub 
    image: dockerdepruebas/dockercompendio-tomcat_app_compendio:latest
    container_name: tomcat_app_compendio
    ports: # Se expone el puerto 8080
      - "8080:8080"
    depends_on:
      - db # Se establece que utiliza la el contenedor de MYSQL
  
  web_golang_compendio: # Pull de la imagen de DockerHub 
    image: dockerdepruebas/dockercompendio-web_golang_compendio 
    container_name: web_golang_compendio
    ports: # Se expone el puerto 8090
      - "8090:8090"
    depends_on:
      - db # Se establece que utiliza la el contenedor de MYSQL
  

volumes: # Se declara el volumen de persistencia
  db_persitence_compendio: {}
  