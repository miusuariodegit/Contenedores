services:
  db:
    image: mysql:8.0 #Seleccionamos la imagen de mysql 8.0 del repositorio de DcokerHub
    container_name: mysql_db
    environment: #establecemos las variables de ambiente 
      MYSQL_ROOT_PASSWORD: mipassword
      MYSQL_DATABASE: crud_python
      MYSQL_USER: usuario             
      MYSQL_PASSWORD: mipassword 
    ports: #exponemos el puerto 3306
      - "3306:3306"
    volumes:
      - ./mysql-init-files:/docker-entrypoint-initdb.d  #Ruta para inicializar los archivos .SQL
      - db_persitence_compendio:/var/lib/mysql # volumen de datos de MYSQL

  python_app_compendio: # Construccion de la aplicacion de Python
    build: 
      context: ./dockerpython
      dockerfile: Dockerfile
      no_cache: true # eliminamos el cache para tener una construccion limpia
    container_name: python_app_compendio
    ports: #exponemos el puerto 5600
      - "5600:5600"
    depends_on:
      - db # se establece que utiliza la el contenedor de MYSQL

  php_app_compendio: # construccion de la aplicacion de PHP
    build: 
      context: ./dockerphp
      dockerfile: Dockerfile 
      no_cache: true # eliminamos el cache para tener una construccion limpia
    container_name: php_app_compendio
    ports:
      - "80:80"
    depends_on:
      - db # se establece que utiliza la el contenedor de MYSQL

  tomcat_app_compendio: # construccion de la aplicacion de java
    build: 
      context: ./dockerjava
      dockerfile: Dockerfile
      no_cache: true  # eliminamos el cache para tener una construccion limpia
    container_name: tomcat_app_compendio
    ports: # exponemos el puerto 8080
      - "8080:8080"
    depends_on:
      - db # se establece que utiliza la el contenedor de MYSQL
  
  web_golang_compendio: # construccion de la aplicacion de golang
    build: 
      context: ./aplicacionGolang
      dockerfile: Dockerfile
      no_cache: true
    container_name: web_golang_compendio
    ports: #exponemos el puerto 8090
      - "8090:8090" 
    depends_on: 
      - db # se establece que utiliza la el contenedor de MYSQL
  

volumes: # Se declara el volumen de persistencia
  db_persitence_compendio: {}
  